services:
  workspace:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TEAM_DB: /data/team.sqlite3
      TEAM_BOOTSTRAP_KEY: ${TEAM_BOOTSTRAP_KEY:?Set a random bootstrap key}
      TEAM_ORIGINS: ${TEAM_ORIGINS:-}
    volumes:
      - team-data:/data
volumes:
  team-data:
